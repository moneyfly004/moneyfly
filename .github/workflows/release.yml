name: Build Release (Android / Windows / macOS)

# 触发方式：
#   1) 推送 tag（如 v1.0.0）→ 自动构建并发布到 GitHub Releases
#   2) 手动触发（Actions 页面 Run workflow，可填版本号）
#
# 需要的仓库 Secrets（Android 正式签名，缺失时回退 debug 签名并仅在本地开发可用）：
#   KEYSTORE_BASE64    release.keystore 的 base64（keytool 生成）
#   KEYSTORE_PASSWORD  keystore 密码
#   KEY_ALIAS          密钥别名
#   KEY_PASSWORD       密钥密码
#
# 生成 keystore 示例：
#   keytool -genkey -v -keystore release.keystore -alias moneyfly \
#     -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
#   base64 -i release.keystore | pbcopy   # 填入 KEYSTORE_BASE64
#
# 内核（MIHOMO_VERSION）：官方 MetaCubeX/mihomo 预编译 release。
#   - 桌面端（Windows/macOS）构建时直接下载官方编译好的二进制内置进安装包；
#   - Android：官方没有可嵌入 VpnService 的 .so/.aar，故由 moneyfly004/mihomo-lib
#     发布仓库负责「官方源码 + gomobile bind 预编译」（每日自动跟随官方新版，
#     无 fork），本 workflow 只做秒级下载，不每次现编内核。
# 离线分流数据：MetaCubeX/meta-rules-dat（geosite.dat / country.mmdb）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，留空则用 pubspec）'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.44.4' # 与开发机一致，保证构建可复现
  MIHOMO_VERSION: '1.19.30' # mihomo 内核版本（升级只改这里；需与 mihomo-lib release tag 一致）

jobs:
  # ================= Android：多 ABI 分版本 =================
  android:
    name: Android (armeabi-v7a / arm64-v8a / x86_64 / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 下载离线分流数据（构建时从 GitHub 拉最新，不在仓库里存二进制）
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      # ---- libmihomo.aar：从 mihomo-lib 发布仓库下载（官方源码预编译，无需每次现编）。
      #      编译与自动跟随官方新版由 moneyfly004/mihomo-lib 的 workflow 负责。----
      - name: 下载 libmihomo.aar（mihomo-lib 预编译发布 v${{ env.MIHOMO_VERSION }}）
        run: |
          mkdir -p android/app/libs
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o android/app/libs/libmihomo.aar \
            "https://github.com/moneyfly004/mihomo-lib/releases/download/v$MIHOMO_VERSION/libmihomo.aar"
          ls -lh android/app/libs/libmihomo.aar

      - name: 依赖
        run: flutter pub get

      - name: 测试
        run: |
          flutter analyze
          flutter test --concurrency=1

      - name: 构建多 ABI APK（适配不同机型架构；obfuscate 混淆再省 ~10% 体积）
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --obfuscate
        env:
          # 正式签名密钥（缺失则 build.gradle.kts 回退 debug）。
          # 必须在此注入，否则 Gradle 读不到 → 每次构建用临时 debug 签名 →
          # 版本间签名不一致，用户无法覆盖升级、必须卸载重装。
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 构建 AAB（应用商店备用）
        run: flutter build appbundle --release --split-debug-info=build/symbols --obfuscate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 重命名产物
        run: |
          V=${{ github.event.inputs.version || github.ref_name }}
          V=${V#v}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MoneyFly-android-armeabi-v7a-$V.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/MoneyFly-android-arm64-v8a-$V.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk  dist/MoneyFly-android-x86_64-$V.apk
          cp build/app/outputs/bundle/release/app-release.aab       dist/MoneyFly-android-$V.aab
          cd dist && sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-android
          path: dist/

  # ================= Windows：exe 安装包 + zip 便携版 =================
  windows:
    name: Windows (exe 安装包 + zip 便携版)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Rosetta 2（x64 构建需要；已安装则跳过）
        if: matrix.rosetta == 'true'
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: 依赖
        run: flutter pub get

      - name: 下载离线分流数据
        shell: bash
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      # ---- 先下载内核：让 flutter test 真实启动内核做端到端验证 ----
      - name: 下载 mihomo 内核（官方预编译，compatible 版）
        shell: bash
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo.zip \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-windows-amd64-compatible-v$MIHOMO_VERSION.zip"
          unzip -o mihomo.zip -d sb
          # 官方 zip 内文件名带平台前缀，按扩展名取
          EXE=$(find sb -iname "*.exe" | head -1)
          [ -n "$EXE" ] && cp "$EXE" build/mihomo/mihomo.exe || { echo "zip 内未找到 exe"; exit 1; }
          ls -la build/mihomo/

      - name: 测试（含真实内核端到端验证）
        shell: bash
        run: |
          export MONEYFLY_MIHOMO="$PWD/build/mihomo/mihomo.exe"
          flutter analyze
          flutter test --concurrency=1

      - name: 构建 Windows release
        run: flutter build windows --release

      # ---- 内核放入 exe 同目录（安装包/zip 随 App 分发）----
      - name: 内置 mihomo 内核
        shell: bash
        run: |
          RELEASE_DIR="build/windows/x64/runner/Release"
          cp build/mihomo/mihomo.exe "$RELEASE_DIR/mihomo.exe"
          ls -la "$RELEASE_DIR/mihomo.exe"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 打包（exe 安装包 + zip 便携版）
        shell: bash
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          V="${V#v}"
          RELEASE_DIR="build/windows/x64/runner/Release"
          mkdir -p dist

          # zip 便携版（解压即用）——powershell 需要 Windows 路径
          WIN_RELEASE_DIR=$(cygpath -w "$(pwd)/$RELEASE_DIR")
          WIN_DIST=$(cygpath -w "$(pwd)/dist")
          powershell -Command "Compress-Archive -Path '$WIN_RELEASE_DIR\*' -DestinationPath '$WIN_DIST\MoneyFly-windows-x64-portable-$V.zip' -Force"

          # Inno Setup 安装版（开始菜单/桌面快捷方式/卸载器）
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DVERSION="$V" //DBUILD_DIR="$WIN_RELEASE_DIR" scripts/windows_installer.iss

          cd dist && sha256sum * > SHA256SUMS.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-windows
          path: dist/

  # ================= macOS：universal + arm64(Apple) + x64(Intel) =================
  # 说明：
  #  - GitHub 公共 Intel runner(macos-13)队列极长，故 x64 在 Apple Silicon runner
  #    用 Rosetta 执行整条 x86_64 构建链（arch -x86_64 flutter build），
  #    产物为纯 x86_64，快照/引擎自洽（不做 universal→thin 裁剪）。
  #  - 官方 mihomo-darwin-amd64 要求 AMD64 v3；Rosetta/老 Intel 不支持，
  #    故 x64 用官方 compatible 版内核。
  #  - universal = lipo 合并 arm64 与 x64 两份 app（scripts/merge_macos_universal.sh）。
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
      - name: 下载 mihomo 内核（测试用）
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && mv mihomo build/mihomo/mihomo && chmod +x build/mihomo/mihomo
      - name: 测试（含真实内核 e2e）
        run: |
          export MONEYFLY_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze
          flutter test --concurrency=1
      - name: 构建 macOS（arm64）
        run: flutter build macos --release
      - name: 校验架构
        run: lipo build/macos/Build/Products/Release/MoneyFly.app/Contents/MacOS/MoneyFly -verify_arch arm64
      - name: 内置 mihomo 内核
        run: |
          APP="build/macos/Build/Products/Release/MoneyFly.app"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && cp mihomo "$APP/Contents/MacOS/mihomo" && chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch arm64
      - name: 打包 arm64 DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/MoneyFly.app"; mkdir -p dist
          STAGE="build/dmg-stage-arm64"; rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/MoneyFly.app" && ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command"
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/MoneyFly.app"
          hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "dist/MoneyFly-macos-arm64-$V.dmg"
          cd dist && shasum -a 256 MoneyFly-macos-arm64-$V.dmg > SHA256SUMS-macos-arm64.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos-arm64
          path: |
            dist/MoneyFly-macos-arm64-*.dmg
            dist/SHA256SUMS-macos-arm64.txt

  macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装 Rosetta 2
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
      - name: 下载 mihomo 内核（测试用，compatible 版）
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-compatible-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && mv mihomo build/mihomo/mihomo && chmod +x build/mihomo/mihomo
      - name: 测试（含真实内核 e2e）
        run: |
          export MONEYFLY_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze
          flutter test --concurrency=1
      - name: 构建 macOS（x64，Rosetta 整链）
        run: arch -x86_64 flutter build macos --release
      - name: 校验架构
        run: lipo build/macos/Build/Products/Release/MoneyFly.app/Contents/MacOS/MoneyFly -verify_arch x86_64
      - name: 内置 mihomo 内核（compatible 版）
        run: |
          APP="build/macos/Build/Products/Release/MoneyFly.app"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-compatible-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && cp mihomo "$APP/Contents/MacOS/mihomo" && chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch x86_64
      - name: 打包 x64 DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/MoneyFly.app"; mkdir -p dist
          STAGE="build/dmg-stage-x64"; rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/MoneyFly.app" && ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command"
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/MoneyFly.app"
          hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "dist/MoneyFly-macos-x64-$V.dmg"
          cd dist && shasum -a 256 MoneyFly-macos-x64-$V.dmg > SHA256SUMS-macos-x64.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos-x64
          path: |
            dist/MoneyFly-macos-x64-*.dmg
            dist/SHA256SUMS-macos-x64.txt

  macos-universal:
    name: macOS universal（Flutter 原生双架构）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
      - name: 下载 mihomo 内核（测试用，arm64）
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && mv mihomo build/mihomo/mihomo && chmod +x build/mihomo/mihomo
      - name: 测试（含真实内核 e2e）
        run: |
          export MONEYFLY_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze
          flutter test --concurrency=1
      # Flutter 在 macOS release 直接产出 universal（arm64+x86_64 双架构），
      # 与 2.0.2 老办法一致
      - name: 构建 macOS release（universal）
        run: flutter build macos --release
      - name: 校验双架构
        run: lipo build/macos/Build/Products/Release/MoneyFly.app/Contents/MacOS/MoneyFly -verify_arch arm64 x86_64
      - name: 内置 mihomo 内核（universal：arm64 + amd64-compatible）
        run: |
          APP="build/macos/Build/Products/Release/MoneyFly.app"
          mkdir -p sb && cd sb
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo-arm64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o mihomo-x64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-compatible-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo-arm64.gz mihomo-x64.gz
          lipo -create mihomo-arm64 mihomo-x64 -output mihomo
          chmod +x mihomo
          cd ..
          cp sb/mihomo "$APP/Contents/MacOS/mihomo"
          chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch arm64 x86_64
      - name: 打包 universal DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/MoneyFly.app"; mkdir -p dist
          STAGE="build/dmg-stage-universal"; rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/MoneyFly.app" && ln -s /Applications "$STAGE/Applications"
          cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command"
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/MoneyFly.app"
          hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "dist/MoneyFly-macos-universal-$V.dmg"
          cd dist && shasum -a 256 MoneyFly-macos-universal-$V.dmg > SHA256SUMS-macos-universal.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos-universal
          path: |
            dist/MoneyFly-macos-universal-*.dmg
            dist/SHA256SUMS-macos-universal.txt

  # ================= iOS：侧载 IPA（TrollStore / 自签） =================
  # 为什么产出「未签名」IPA：iOS 的 VPN 必须由 NetworkExtension 提供，依赖
  # packet-tunnel-provider entitlement —— 苹果只在付费开发者账号下签发。
  # 本项目走侧载分发（TrollStore / Sideloadly / AltStore），由设备侧安装器
  # 完成签名与授权。因此这里产出「结构完整、已内嵌 entitlements」的 IPA：
  #   Payload/Runner.app/PlugIns/PacketTunnel.appex  ← 内核（mihomo）跑在这里
  # ad-hoc 签名（codesign -s -）不带 Apple 描述文件，因此可以携带任意
  # entitlements，正是侧载工具能识别并沿用的形态。
  ios:
    name: iOS (unsigned IPA, sideload)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 下载离线分流数据（iOS 随扩展 bundle 分发）
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/
      - name: 下载 iOS 内核框架（Mihomelib.xcframework）
        run: bash tool/fetch_mihomo_ios.sh "$MIHOMO_VERSION"
      - name: 自检扩展 target 已就位
        run: |
          grep -q "PacketTunnel" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "error: 缺少 PacketTunnel 扩展 target（先运行 ruby tool/ios_setup_tunnel_target.rb）"; exit 1; }
      - name: 校验 iOS 图标（仓库级，确保是品牌画稿而非 Flutter 默认模板）
        run: |
          # 用生成脚本重建一遍并与提交内容比对：不一致说明图标被改回默认模板
          # 或未随画稿更新（脚本内含与 Android 的像素一致性自检）
          # Pillow 在 macOS runner 上受 PEP 668 保护，装不上就跳过本步校验
          # （绝不能因为「装不上依赖」把构建判失败 —— 已踩过一次）
          if ! python3 -c "import PIL" 2>/dev/null; then
            python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null \
              || python3 -m pip install --quiet --user pillow 2>/dev/null || true
          fi
          if ! python3 -c "import PIL" 2>/dev/null; then
            echo "warning: 无 Pillow，跳过仓库级图标像素校验（IPA 内仍有尺寸断言）"
            exit 0
          fi
          python3 tool/gen_ios_icons.py
          # 与提交版本做**像素**比对（不比字节：Pillow/zlib 版本差异会改变
          # PNG 编码字节，但不是问题；像素不同才是真问题——例如被改回默认模板）
          python3 - <<'PYCHECK'
          import glob, io, os, subprocess, sys
          from PIL import Image
          bad = []
          for f in sorted(glob.glob('ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png')):
              old = subprocess.run(['git', 'show', f'HEAD:{f}'],
                                   capture_output=True).stdout
              if not old:
                  continue
              a = Image.open(io.BytesIO(old)).convert('RGB')
              b = Image.open(f).convert('RGB')
              if a.size != b.size or a.tobytes() != b.tobytes():
                  bad.append(os.path.basename(f))
          if bad:
              sys.exit('error: iOS 图标与品牌画稿像素不一致: ' + ', '.join(bad))
          print('✓ iOS 图标与提交版本像素一致（品牌画稿，非默认模板）')
          PYCHECK

      - name: 构建 iOS release（不签名）
        run: flutter build ios --release --no-codesign
      - name: 组装 IPA（含扩展 + 内嵌 entitlements）
        run: |
          set -e
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/ios/iphoneos/Runner.app"
          [ -d "$APP/PlugIns/PacketTunnel.appex" ] || {
            echo "error: Runner.app 内未嵌入 PacketTunnel.appex"; ls -la "$APP"; exit 1; }
          rm -rf Payload dist; mkdir -p Payload dist
          cp -R "$APP" Payload/
          # 签名：ad-hoc（codesign -s -），内嵌各自 entitlements。
          # 顺序「先内层 appex、后外层 app」。
          codesign --force -s - \
            --entitlements ios/PacketTunnel/PacketTunnel.entitlements \
            Payload/Runner.app/PlugIns/PacketTunnel.appex
          codesign --force -s - \
            --entitlements ios/Runner/Runner.entitlements \
            Payload/Runner.app
          zip -qry "dist/MoneyFly-ios-$V.ipa" Payload
          (cd dist && shasum -a 256 "MoneyFly-ios-$V.ipa" > SHA256SUMS-ios.txt && ls -lh)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-ios
          path: |
            dist/MoneyFly-ios-*.ipa
            dist/SHA256SUMS-ios.txt

  # ================= 发布到 GitHub Releases =================
  release:
    name: 发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos-arm64, macos-x64, macos-universal, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: |
            # MoneyFly ${{ github.ref_name }}

            ## 安装包与系统要求
            - **Android**: `MoneyFly-android-arm64-v8a / armeabi-v7a / x86_64 .apk` + `.aab`（Android 8.0+）
            - **macOS arm64**（Apple 芯片）: `MoneyFly-macos-arm64-*.dmg` — 需 **macOS 11+**
            - **macOS x64**（Intel，原生构建）: `MoneyFly-macos-x64-*.dmg` — 需 **macOS 10.15+**（建议 11+）
            - **Windows**: `MoneyFly-setup-*.exe` 安装版 + `MoneyFly-windows-x64-portable-*.zip`（Windows 10+）
            - **iOS**: `MoneyFly-ios-*.ipa`（**未签名，需侧载**）— 需 **iOS 14+**
              - **TrollStore（巨魔）直接安装**：包内已内嵌 Network Extension entitlement，无需 Apple 账号
              - 或用 Sideloadly / AltStore 自签（需**付费** Apple 开发者账号才能启用 VPN 能力）
              - 隧道由 PacketTunnel 扩展提供（内核 mihomo 跑在扩展进程内）
            - **iOS**: `MoneyFly-ios-*.ipa`（**未签名，需侧载**：TrollStore 直接安装；或用 Sideloadly / AltStore 自签）— 需 **iOS 14+**
              - 隧道依赖 NetworkExtension entitlement，苹果只对付费开发者账号签发，故本包不带 Apple 签名，由设备侧安装器授权

            各架构安装包均为原生编译、内置匹配架构内核，请勿跨架构混装。

            ## 本版更新（2.2.7）
            - **主页卡片「来回跳动」修复（本次重点）**：主页卡片内容此前每秒左右抖、连上/断开时还上下跳。根因是**数值文本每秒在变宽，而布局没给这些位置留固定宽度**：速率数字的位数每秒变化，紧挨着的单位（`KB/s` / `MB/s`）就被推着左右移动；「已连接 时长 · ↑ ↓」这一行也是居中的单行文本，↑/↓ 累计值变宽（`1.2 MB` → `12.3 MB` → `1.02 GB`）导致整行每秒重新居中。现在数值与单位各占**固定宽度槽位**、数字使用等宽数字特性，会话行同样改为固定槽位 + 单行不换行 + 定高。实测旧版本单位横跳 26px。
            - **速率单位不再每秒翻转**：单位切换的分界点（0.1 MB/s）正好落在空闲时的抖动区间，于是 `KB/s` 与 `MB/s` 每秒来回切。现在加了迟滞（低于 0.08 才切到 KB/s、高于 0.15 才切回 MB/s），完全空闲时沿用上次单位。
            - **趋势线不再让下方内容上下顶**：迷你趋势线此前按「样本数 ≥ 2」决定是否绘制 —— 连上约 2 秒后卡片突然长高 36px、断开清空数据又缩回，下方所有卡片跟着上下位移（实测 36px）。现在恒定占位，样本不足时画一条基线。
            - **状态文案 / 真实出口 / 延迟胶囊不再撑动布局**：这些文本原本高度随内容变化（「已连接」↔「已连接 · 测速中」、「检测中…」↔ 国家 ↔ 检测失败可点重试），现统一为单行定高；延迟胶囊的数字也给了固定宽度，`9 ms` ↔ `123 ms` 不再改变胶囊宽度。
            - **节点列表测速时不再「自己来回跳」**：节点选择弹窗此前每 300ms 自动按延迟重排，而测速以约 10fps 逐节点回填 → 表在测速过程中不断换位。现在只在**测速结束**或订阅刷新（列表被整体替换）时重排一次，测速过程中只更新高亮与延迟数字。

            ## 历史更新（2.2.6 及更早）
            - **TUN 连接修复（重要）**：修「TUN 明明正常，却被判定为失败并**中断连接**」。原判定是「日志行里同时含 `tun` 和 `error`/`failed`」，而内核有一批正常日志同样命中 —— 最典型的是 `[TUN] Auto detect interface … failed`（多虚拟网卡 / Hyper-V / 部分 VPN 环境下探不到出口接口，属正常告警），以及 `error writing to TUN device` 这类数据面偶发噪音。命中即中断连接、还提示「请以管理员身份运行」，用户按提示提权后依旧失败，真因被掩盖。现在只认真正的启动失败（`Start TUN listening error` / `Start Tun interface timeout`），并改为**收到日志即判定**（不受日志缓冲区与日志级别影响）。
            - **TUN 失败提示按原因给**：不再一律「请以管理员身份运行」，而是区分 **权限不足** / **同名虚拟网卡残留**（提权也解决不了，需重启系统后重试）/ **驱动被安全软件拦截**，各自给出对应处理办法；无法归类时指向日志中心并附内核原始错误。
            - **TUN 失败不再静默**：自动模式（TUN + 系统代理）下 TUN 起不来时，此前界面显示「已连接」，用户以为游戏/UDP 走了代理、实际是直连；现在会明确记录一条错误日志（含内核原因），说明本次仅系统代理生效。
            - **局域网改为在路由层排除（TUN 模式）**：与「局域网直连」设置的语义对齐 —— 此前局域网数据包要先被虚拟网卡抓进去、再靠规则绕回，NAS / 网络打印机 / mDNS、SSDP 局域网发现 / 局域网联机会变慢甚至找不到设备。现在直接在路由层排除 `10/8`、`172.16/12`、`192.168/16`、`169.254/16`、`224/4`、`127/8`（关闭「局域网直连」时不排除）。
            - **修复一个点了没用的开关**：iOS 上「TUN 虚拟网卡」设置行此前可以点选，但移动端 TUN 由系统隧道强制接管、改它不生效（用户以为关掉了 TUN，其实仍在走）——该行现在只在真正可选的平台显示。
            - **不再为确定性失败做无意义重试**：TUN 权限类失败无法靠重试自愈，此前会按重连次数重试（默认 3 次约 8 秒，重连次数调大时更久）之后才给提示；现在立即给出可执行的提示。

            - **断线自愈（重要）**：内核进程被安全软件结束/崩溃后，App 此前**一次都不会重试** —— 「断线自动重连」默认关闭，内核异常退出直接落到「已断开」，用户侧表现为「好好的突然只能直连、App 一声不吭」（实测日志里 code=1 静默退出后 count=0，一小时无任何重试）。现在内核异常退出与用户偏好**解耦**：属于客户端自身故障，始终自动拉起（最多 3 次；10 分钟内反复崩溃仍熔断停止，不会陷入连崩循环）。
            - **多实例误杀（重要）**：修「新实例启动时的残留内核清扫，把**另一个实例正在使用的活内核**杀掉」—— 症状是莫名断线、日志里内核退出码 -1（PowerShell Stop-Process 的终止码），随后又因上一条不再恢复。清扫现在只收**父进程已消失的真孤儿**：仍在工作的内核一律不动，同时保留「退出后重开连不上」的端口/缓存锁清理能力。
            - **系统代理误清（重要）**：启动巡检不再把**端口仍有进程监听**（即活着的）系统代理当成残留清掉 —— 那会让界面显示「已连接」但浏览器打不开网页。判据改为「指向本机端口 **且** 该端口已无人监听」才算残留；并调整启动顺序为「先收残留内核、再判系统代理」，避免收掉内核后把系统代理指向一个刚被我们杀死的端口（重启 App 反而整机断网）。
            - **崩溃取证**：内核输出全量落盘 `kernel_log.txt`，异常退出另存 `kernel_crash.log`（退出码 + 完整尾部 200 行，且活过 App 重启）。此前只剩内存里 40 行尾部，进程一死就无从查证「内核被谁杀的」。
            - **单实例守卫**：macOS / Linux 补上排他文件锁（此前只有 Windows 有原生守卫）—— `open -n` 双开不再出现两个实例各自清理对方内核与系统代理。调试需要双开时可用 `MONEYFLY_ALLOW_MULTI=1`。
            - **配置迁移**：老版本存下的明文 `http://` 测速地址自动迁移为 HTTPS（明文易被运营商/代理商劫持，会让在线节点被误判成掉线，内核日志满屏 `failed to get the second response from http://...`）；用户自定义的地址不动。
            - **出口定位**：外呼超时 5s → 8s，跨境线路上不再把「慢但可用」判成失败。
            - **内核异常退出的错误文案**：内核反复异常退出时不再显示含糊的「连接已断开」，而是直接指向排查方向（安全软件拦截内核进程 / 端口与缓存锁冲突），并带出内核退出码。

            - **订阅修复（重要）**：部分机场（base64 整包订阅，响应体末尾带换行）在 App 里会解析出 **0 个节点**且没有任何报错 —— Dart 的 base64 归一化不容忍空白字符，异常被吞后整份订阅静默变空。现兼容末尾换行/76 字符折行/无 `=` 填充/CRLF/带 BOM
            - **订阅修复**：`hy2://` 简写（sing-box / v2rayN 通用）此前不被识别，整份订阅里的 hy2 节点被静默丢弃；另修复该路径下 UUID 密码被截断 6 个字符导致永远连不上
            - **节点修复**：hysteria2 / tuic 类节点普遍使用伪装 SNI（证书与 SNI 必然对不上），链接里却写 `insecure=0`，校验开着 100% 握手失败（实测同一批 17 个节点：严格校验 0/17 成功，放宽后 16/17 成功）。现默认放宽这两种协议的证书校验，设置页「代理与分流 → 放宽 hy2/tuic 证书校验」可关闭
            - **节点修复**：节点页筛选/搜索后点「⚡测速」此前会**只弹提示、实际不测速**（连接后自动跑的后台测速占着通道，用户请求被静默丢弃），且筛出 50 个也不显示 `1/50` 进度。现用户请求排队执行、进度分母就是筛出的节点数，未筛中的节点状态原样保留
            - **首页修复**：刚登录时订阅还在拉取，连接按钮下方却显示红色错误文案（易被误解成软件故障）；现同步期间显示「正在同步订阅…」，只有真失败才报错
            - **Android 修复**：真实出口定位不再误报红色错误 —— 第三个源（ipinfo）原先没包异常捕获，它的 TLS 异常被记成含糊的「lookupViaProxy 失败」，掩盖了「三个源全挂」；现逐源捕获并把原因说清（TLS 握手被中断/超时/不可达）
            - **Android 改进**：出口定位失败时自动对当前节点做一次内核测速交叉判定 —— 测速也失败才报「节点疑似不可用」（真该报警的情况），测速正常则只记普通日志，不再误报为连接故障
            - **CI**：IPA 校验增加应用图标断言（尺寸 120x120/152x152 + 无 alpha），并修正了包内 Apple CgBI PNG 的解析偏移
            - **iOS 修复（重要）**：隧道就绪语义分层 —— 网络参数下发成功即报告隧道就绪、内核改为异步启动。原先要等内核 Start 返回才算就绪，一旦它卡住/失败，NE 会话会一直停在 connecting：App 既等不到「已连接」，也无法向扩展索取诊断，现场只剩一句「内核启动超时」
            - **iOS 诊断**：内核启动失败会主动拿下隧道（cancelTunnelWithError）并带出原因；新增 App 侧会话状态轨迹（NE 状态每次变化都记录）、App Group 可用性、内核日志内存尾部（App Group 失效也能取到）
            - **日志页修复**：运行日志/内核日志不再顶部留一大片空白（原用 reverse 让最新贴底，日志少时内容全堆在底部）
            - **日志页修复**：内核日志级别现在同时过滤本页显示（原先只改内核输出，切级别看不出区别），并补充级别语义说明
            - **日志页说明**：运行日志页标注「[ERROR] 是错误级别记录，不是崩溃日志」；崩溃日志为 Dart 未捕获异常，单独存于文档目录 crash_logs/
            - **iOS 修复**：应用图标改为品牌画稿（原先误用 Flutter 默认图标，与 Android/桌面不一致）
            - **iOS 修复**：内核开启 auto-detect-interface（原先被按 Android 语义强制关闭）——iOS 上扩展进程自己的出站流量会命中它自己下发的默认路由，缺少该选项会导致连自己的代理服务器都连不出去
            - **iOS 修复**：隧道启动全过程写入诊断轨迹（扩展是否被拉起 / 配置来源 / fd 获取 / 内核启动耗时与返回 / 内核 API 自检），连接失败时会带出真实原因，不再只有「内核启动超时」
            - **iOS 修复**：不再复用/覆盖用户其它 VPN 配置（原先取 managers.first）
            - 新增：**iOS 版本**（未签名 IPA，TrollStore / 自签侧载安装），内核跑在 PacketTunnel 网络扩展内
            - 修复：系统代理残留恢复原先完全空转（新进程里状态恒为空），残留代理会导致重启后整机断网；改为枚举式清扫
            - 修复：Android「仅勾选应用」模式把自己也放进隧道，导致进程内内核自代理循环（该模式下无流量）
            - 修复：就绪判定只看 Clash API 200，端口被占用/非法时内核照跑照 200 → 误判「已连接」并把系统代理指向死端口；补充本地端口探活与 TUN 失败检测
            - 修复：内核启停无互斥，快速连点可双开内核并留下清不掉的孤儿进程（占死端口与 cache.db）
            - 修复：重连上限「一连上就清零」，内核反复崩溃时会无限自连；改为稳定存活后才清零并加熔断
            - 修复：内核异常退出原因（如 code=-9）不进 UI，只能自己翻日志
            - 修复：系统代理绕过列表 macOS 完全不设、Windows 只有 <local>，已按平台补全
            - 修复：日志旋转在超长单行时上限失效（文件可无界增长）
            - 修复：更新包可能匹配到其它平台/架构（Windows 用户被引导下载 APK）
            - 修复：默认测速地址仍是明文 HTTP（易被劫持导致测速失真），改 HTTPS 并加延迟可信区间
            - 修复：geo 数据非原子写入且失败也标记已同步，可静默损坏分流规则
            - 修复：TUN 开关改了不生效也不提示；Android 日志级别同样静默
            - 修复：桌面 TUN 复用 Android 语义（auto-route:false）导致形同虚设
            - 修复：注销/关机不清理系统代理（Windows WM_ENDSESSION / macOS applicationShouldTerminate 钩子）
            - 优化：订阅拉取加请求序号，作废的在途结果不再把老配置写回；定时刷新失败退避
            - 新增：注销/关机清理、订阅自定义 UA、CI 真实内核 -t 校验（生成配置有了回归防线）
            - 修复：清理僵尸内核时可能误杀当前连接（改为跳过本 App 启动的内核子进程）
            - 新增：6 套完整主题（海洋蓝/暗夜黑/石墨灰/翡翠绿/紫罗兰/暖咖橙），设置页一键切换并记忆
            - 优化：暗色主题整体调亮（背景改中灰黑）+ 文字提亮，信息卡/菜单/套餐文字清晰可读
            - 新增：桌面端关闭窗口可「记住我的选择」（最小化/退出），设置页可随时恢复为每次询问
            - 新增：新版红点提示（底部「我的」tab 与设置「版本更新」行），启动后台静默检测
            - 修复：套餐价格显示取整导致小数金额（如 0.02 元）在列表显示成 0 元
            - 节点兼容：链接订阅新增支持 Shadowsocks / SSR / SOCKS5 / Hysteria(v1/v2) / TUIC / AnyTLS / WireGuard 等协议
            - 修复：Shadowsocks(SIP002) 密码与加密方式解析错误导致无法连接
            - 修复：VLESS 链接 UUID 错位、Reality/gRPC 参数丢失；VMess 链接 type 冲突导致内核拒载
            - 修复：UDP 类协议（Hysteria/TUIC/WireGuard）未连接时测速被误判离线（改为「连接后测速」，连接后内核实测）
            - 安全：http 日志对登录/刷新等敏感接口的响应体脱敏，不再明文落盘令牌
            - 日志：内核日志新增 error/silent 级别；运行日志支持「只看错误」过滤 + 错误红色高亮
            - 卸载：macOS 新增双击卸载脚本（随 DMG 分发），删除配置/节点/缓存/令牌等全部数据
          # 本次构建的版本必须成为「最新版」：App 的更新检查读
