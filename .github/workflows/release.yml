name: Build Release (Android / Windows / macOS)

# 触发方式：
#   1) 推送 tag（如 v1.0.0）→ 自动构建并发布到 GitHub Releases
#   2) 手动触发（Actions 页面 Run workflow，可填版本号）
#
# 需要的仓库 Secrets（Android 正式签名，缺失时回退 debug 签名并仅在本地开发可用）：
#   KEYSTORE_BASE64    release.keystore 的 base64（keytool 生成）
#   KEYSTORE_PASSWORD  keystore 密码
#   KEY_ALIAS          密钥别名
#   KEY_PASSWORD       密钥密码
#
# 生成 keystore 示例：
#   keytool -genkey -v -keystore release.keystore -alias moneyfly \
#     -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
#   base64 -i release.keystore | pbcopy   # 填入 KEYSTORE_BASE64
#
# 内核（MIHOMO_VERSION）：官方 MetaCubeX/mihomo 预编译 release。
#   - 桌面端（Windows/macOS）直接下载官方编译好的二进制内置进安装包；
#   - Android 官方没有可嵌入 VpnService 的 .so/.aar（只有可执行文件），
#     故在 CI 上用官方 v1.19.30 源码 + gomobile bind 编译 libmihomo.aar
#     （源码官方原版，无 fork；编译只发生在 Actions 服务器，本地零 Go 依赖）。
# 离线分流数据：MetaCubeX/meta-rules-dat（geosite.dat / country.mmdb）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，留空则用 pubspec）'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.44.4' # 与开发机一致，保证构建可复现
  MIHOMO_VERSION: '1.19.30' # mihomo 内核版本（升级只改这里）
  GO_VERSION: '1.26.6' # 与 android/mihomo-core/go.mod 及官方构建一致

jobs:
  # ================= Android：多 ABI 分版本 =================
  android:
    name: Android (armeabi-v7a / arm64-v8a / x86_64 / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: android/mihomo-core/go.sum

      - name: 下载离线分流数据（构建时从 GitHub 拉最新，不在仓库里存二进制）
        run: |
          mkdir -p assets/rules
          curl -fL --max-time 120 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --max-time 120 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      - name: 安装 Android NDK（gomobile 编译 libmihomo.aar 需要）
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: 编译 libmihomo.aar（官方 mihomo 源码 gomobile bind，无 fork）
        run: |
          mkdir -p android/app/libs
          cd android/mihomo-core
          go mod download
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          gomobile bind \
            -target=android \
            -androidapi 21 \
            -tags with_gvisor \
            -javapkg top.moneyfly \
            -o ../app/libs/libmihomo.aar .
          ls -lh ../app/libs/libmihomo.aar

      - name: 依赖
        run: flutter pub get

      - name: 测试
        run: |
          flutter analyze
          flutter test --concurrency=1

      - name: 构建多 ABI APK（适配不同机型架构；obfuscate 混淆再省 ~10% 体积）
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --obfuscate
        env:
          # 正式签名密钥（缺失则 build.gradle.kts 回退 debug）。
          # 必须在此注入，否则 Gradle 读不到 → 每次构建用临时 debug 签名 →
          # 版本间签名不一致，用户无法覆盖升级、必须卸载重装。
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 构建 AAB（应用商店备用）
        run: flutter build appbundle --release --split-debug-info=build/symbols --obfuscate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 重命名产物
        run: |
          V=${{ github.event.inputs.version || github.ref_name }}
          V=${V#v}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MoneyFly-android-armeabi-v7a-$V.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/MoneyFly-android-arm64-v8a-$V.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk  dist/MoneyFly-android-x86_64-$V.apk
          cp build/app/outputs/bundle/release/app-release.aab       dist/MoneyFly-android-$V.aab
          cd dist && sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-android
          path: dist/

  # ================= Windows：exe 安装包 + zip 便携版 =================
  windows:
    name: Windows (exe 安装包 + zip 便携版)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 下载离线分流数据
        shell: bash
        run: |
          mkdir -p assets/rules
          curl -fL --max-time 120 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --max-time 120 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      # ---- 先下载内核：让 flutter test 真实启动内核做端到端验证 ----
      - name: 下载 mihomo 内核（官方预编译）
        shell: bash
        run: |
          mkdir -p build/mihomo
          curl -fL --max-time 300 -o mihomo.zip \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-windows-amd64-v$MIHOMO_VERSION.zip"
          unzip -o mihomo.zip -d sb
          find sb -name "mihomo.exe" -exec cp {} build/mihomo/mihomo.exe \;
          ls -la build/mihomo/

      - name: 测试（含真实内核端到端验证）
        shell: bash
        run: |
          export MONEYFLY_MIHOMO="$PWD/build/mihomo/mihomo.exe"
          flutter analyze
          flutter test --concurrency=1

      - name: 构建 Windows release
        run: flutter build windows --release

      # ---- 内核放入 exe 同目录（安装包/zip 随 App 分发）----
      - name: 内置 mihomo 内核
        shell: bash
        run: |
          RELEASE_DIR="build/windows/x64/runner/Release"
          cp build/mihomo/mihomo.exe "$RELEASE_DIR/mihomo.exe"
          ls -la "$RELEASE_DIR/mihomo.exe"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 打包（exe 安装包 + zip 便携版）
        shell: bash
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          V="${V#v}"
          RELEASE_DIR="build/windows/x64/runner/Release"
          mkdir -p dist

          # zip 便携版（解压即用）——powershell 需要 Windows 路径
          WIN_RELEASE_DIR=$(cygpath -w "$(pwd)/$RELEASE_DIR")
          WIN_DIST=$(cygpath -w "$(pwd)/dist")
          powershell -Command "Compress-Archive -Path '$WIN_RELEASE_DIR\*' -DestinationPath '$WIN_DIST\MoneyFly-windows-x64-portable-$V.zip' -Force"

          # Inno Setup 安装版（开始菜单/桌面快捷方式/卸载器）
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DVERSION="$V" //DBUILD_DIR="$WIN_RELEASE_DIR" scripts/windows_installer.iss

          cd dist && sha256sum * > SHA256SUMS.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-windows
          path: dist/

  # ================= macOS：Apple 芯片 + Intel 芯片 + 通用版 =================
  macos:
    name: macOS (arm64 Apple 芯片 / x86_64 Intel / universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Rosetta 2（构建 x86_64 快照需要；已安装则跳过）
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: 依赖
        run: flutter pub get

      - name: 下载离线分流数据
        run: |
          mkdir -p assets/rules
          curl -fL --max-time 120 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --max-time 120 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      # ---- 先下载内核（arm64 即可）：让 flutter test 真实启动内核做端到端验证 ----
      - name: 下载 mihomo 内核（测试用，官方预编译）
        run: |
          mkdir -p build/mihomo
          curl -fL --max-time 300 -o mihomo-arm64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo-arm64.gz
          mv mihomo-arm64 build/mihomo/mihomo
          chmod +x build/mihomo/mihomo
          ls -la build/mihomo/

      - name: 测试（含真实内核端到端验证）
        run: |
          export MONEYFLY_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze
          flutter test --concurrency=1

      # release 默认即 universal（arm64 + x86_64 双架构）
      - name: 构建 macOS universal
        run: flutter build macos --release

      - name: 校验双架构
        run: lipo build/macos/Build/Products/Release/MoneyFly.app/Contents/MacOS/MoneyFly -verify_arch arm64 x86_64

      # ---- 内置 mihomo 内核（universal 合并后放入 Contents/MacOS，
      #      thin_app.sh 会按目标架构自动裁剪）----
      - name: 下载并内置 mihomo 内核（universal）
        run: |
          APP="build/macos/Build/Products/Release/MoneyFly.app"
          mkdir -p sb && cd sb
          curl -fL --max-time 300 -o mihomo-arm64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          curl -fL --max-time 300 -o mihomo-amd64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-v$MIHOMO_VERSION.gz"
          # 官方 .gz 解压后就是单文件可执行（非目录结构）
          gunzip -f mihomo-arm64.gz mihomo-amd64.gz
          lipo -create mihomo-arm64 mihomo-amd64 -output mihomo
          chmod +x mihomo
          cd ..
          cp sb/mihomo "$APP/Contents/MacOS/mihomo"
          chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch arm64 x86_64

      - name: 生成三个版本 DMG（Apple 芯片 / Intel / 通用）
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          V="${V#v}"
          APP="build/macos/Build/Products/Release/MoneyFly.app"
          mkdir -p dist

          # 打包辅助：把 App 放入含「应用程序」快捷方式的暂存目录，保证可拖拽安装
          make_dmg() { # $1=源App $2=输出dmg
            STAGE="build/dmg-stage"
            rm -rf "$STAGE" && mkdir -p "$STAGE"
            cp -R "$1" "$STAGE/MoneyFly.app"
            ln -s /Applications "$STAGE/Applications"
            # 保留 entitlements（Keychain/网络），否则登录报 -34018
            codesign --force --deep -s - \
              --entitlements macos/Runner/Release.entitlements \
              "$STAGE/MoneyFly.app"
            hdiutil create -volname MoneyFly -srcfolder "$STAGE" -ov -format UDZO "$2"
          }

          # 通用版（arm64 + x86_64）
          make_dmg "$APP" "dist/MoneyFly-macos-universal-$V.dmg"

          # Apple 芯片版（仅 arm64）
          cp -R "$APP" "build/MoneyFly-arm64.app"
          scripts/thin_app.sh arm64 "build/MoneyFly-arm64.app"
          make_dmg "build/MoneyFly-arm64.app" "dist/MoneyFly-macos-arm64-$V.dmg"

          # Intel 版（仅 x86_64）
          cp -R "$APP" "build/MoneyFly-x64.app"
          scripts/thin_app.sh x86_64 "build/MoneyFly-x64.app"
          make_dmg "build/MoneyFly-x64.app" "dist/MoneyFly-macos-x64-$V.dmg"

          cd dist && shasum -a 256 * > SHA256SUMS.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: moneyfly-macos
          path: dist/

  # ================= 发布到 GitHub Releases =================
  release:
    name: 发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: "Bug fixes and improvements."
          generate_release_notes: false
          fail_on_unmatched_files: true
