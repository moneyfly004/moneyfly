name: Cleanup (runs + releases) [temporary]

# 临时工作流：借仓库自带的 GITHUB_TOKEN 完成两件本地 gh 无权限做的事：
#   1) 清空全部 Actions 运行记录（保留本次运行自身）；
#   2) 删除 .github/cleanup-tmp.txt 里列出的 release 及其 tag。
# 用完即删（见提交记录），不属于长期设施。
on:
  push:
    branches: [main]
    paths: ['.github/cleanup-tmp.txt']
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 删除全部 Actions 运行记录（保留本次）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          SELF="${{ github.run_id }}"
          for round in 1 2 3; do
            ids=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
                  --jq ".workflow_runs[] | select(.id != ${SELF}) | .id" 2>/dev/null || true)
            [ -z "$ids" ] && break
            cnt=0
            for id in $ids; do
              if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1; then
                cnt=$((cnt+1))
              fi
            done
            echo "第 ${round} 轮删除 ${cnt} 条"
            sleep 3
          done
          echo -n "剩余运行记录总数: "
          gh api "repos/${{ github.repository }}/actions/runs?per_page=1" --jq '.total_count'

      - name: 删除 listed release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=.github/cleanup-tmp.txt
          [ -f "$f" ] || exit 0
          while read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in \#*) continue ;; esac
            echo "→ 删除 release/tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null \
              || gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null \
              || echo "  （已不存在或无权限）"
          done < "$f"
          echo "剩余 release:"; gh release list --limit 5 || true

      - name: 清空触发文件（带 skip ci，不再自触发）
        run: |
          printf '' > .github/cleanup-tmp.txt
          git config user.name "cleanup-bot"
          git config user.email "cleanup@local"
          git add .github/cleanup-tmp.txt
          git commit -m "chore(ci): cleanup trigger cleared [skip ci]" || true
          git push || true
