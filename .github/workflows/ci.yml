name: CI (Analyze + Test)

# 每次 push 到 main 或提 PR 时快速校验（不构建安装包，构建发布见 release.yml）
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  ci:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 依赖
        run: flutter pub get

      - name: 校验
        run: |
          flutter analyze
          flutter test
