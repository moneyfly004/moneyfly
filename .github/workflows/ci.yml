name: CI (Analyze + Test)

# 每次 push 到 main 或提 PR 时快速校验（不构建安装包，构建发布见 release.yml）
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  ci:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 依赖
        run: flutter pub get

      - name: 下载 mihomo 离线分流数据（assets 声明依赖，缺失会导致 test/构建失败）
        run: |
          mkdir -p assets/rules
          curl -fL --max-time 120 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --max-time 120 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      - name: 校验
        run: |
          flutter analyze
          flutter test
