name: CI (Analyze + Test)

# 每次 push 到 main 或提 PR 时快速校验（不构建安装包，构建发布见 release.yml）
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.4'
  MIHOMO_VERSION: '1.19.30'

jobs:
  ci:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 依赖
        run: flutter pub get

      - name: 下载 mihomo 离线分流数据（assets 声明依赖，缺失会导致 test/构建失败）
        run: |
          mkdir -p assets/rules
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/geosite.dat \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 -o assets/rules/country.mmdb \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb"
          ls -lh assets/rules/

      # 关键：把内核放到 test/gen_mihomo_test.dart 会查找的路径
      # （mihomo-bin/mihomo）。否则「真实内核 -t 校验」用例永远 skip，
      # 生成配置的正确性就没有回归防线（端口/CIDR/stack 之类的错误只能等
      # 用户侧内核启动失败才暴露）。
      - name: 下载 mihomo 内核（让真实内核 -t 用例真正执行）
        run: |
          mkdir -p mihomo-bin
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 \
            -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${{ env.MIHOMO_VERSION }}/mihomo-linux-amd64-compatible-v${{ env.MIHOMO_VERSION }}.gz"
          gunzip -f /tmp/mihomo.gz
          mv /tmp/mihomo mihomo-bin/mihomo
          chmod +x mihomo-bin/mihomo
          ./mihomo-bin/mihomo -v

      - name: 校验
        run: |
          flutter analyze
          flutter test
        env:
          MONEYFLY_MIHOMO: ${{ github.workspace }}/mihomo-bin/mihomo
